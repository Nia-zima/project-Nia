name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  frontend-build:
    name: Frontend Build (Required)
    runs-on: ubuntu-latest
    outputs:
      duration_seconds: ${{ steps.timing_end.outputs.seconds }}
    steps:
      - name: Record Start Time
        id: timing_start
        run: echo "start=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Cache Next.js Build Cache
        uses: actions/cache@v4
        with:
          path: frontend/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('frontend/package-lock.json') }}-${{ hashFiles('frontend/app/**/*', 'frontend/components/**/*', 'frontend/lib/**/*') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('frontend/package-lock.json') }}-

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Frontend
        working-directory: frontend
        run: npm run build

      - name: Record Duration
        id: timing_end
        if: ${{ always() }}
        run: |
          end=$(date +%s)
          start=${{ steps.timing_start.outputs.start }}
          echo "seconds=$((end-start))" >> "$GITHUB_OUTPUT"

  frontend-priority-lint:
    name: Frontend Priority Lint (Required)
    runs-on: ubuntu-latest
    outputs:
      duration_seconds: ${{ steps.timing_end.outputs.seconds }}
    steps:
      - name: Record Start Time
        id: timing_start
        run: echo "start=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Run Priority Lint
        working-directory: frontend
        run: npm run lint:priority

      - name: Record Duration
        id: timing_end
        if: ${{ always() }}
        run: |
          end=$(date +%s)
          start=${{ steps.timing_start.outputs.start }}
          echo "seconds=$((end-start))" >> "$GITHUB_OUTPUT"

  backend-smoke-tests:
    name: Backend Smoke Tests (Required)
    runs-on: ubuntu-latest
    outputs:
      duration_seconds: ${{ steps.timing_end.outputs.seconds }}
    steps:
      - name: Record Start Time
        id: timing_start
        run: echo "start=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            pyproject.toml
            requirements.txt
            constraints.txt

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest

      - name: Run Backend Smoke Tests
        run: |
          pytest -q tests/test_external_data.py tests/test_depth_selector.py tests/test_phase2_review_window.py

      - name: Record Duration
        id: timing_end
        if: ${{ always() }}
        run: |
          end=$(date +%s)
          start=${{ steps.timing_start.outputs.start }}
          echo "seconds=$((end-start))" >> "$GITHUB_OUTPUT"

  ci-timing-report:
    name: CI Timing Report
    if: ${{ github.event_name == 'pull_request' && always() }}
    runs-on: ubuntu-latest
    needs:
      - frontend-build
      - frontend-priority-lint
      - backend-smoke-tests
    steps:
      - name: Comment PR with Timing
        uses: actions/github-script@v7
        with:
          script: |
            const marker = "<!-- ci-timing-report -->";
            const fmt = (s) => {
              const n = Number(s || 0);
              const mm = Math.floor(n / 60);
              const ss = String(n % 60).padStart(2, "0");
              return `${mm}:${ss}`;
            };
            const rows = [
              {
                name: "Frontend Build",
                result: "${{ needs.frontend-build.result }}",
                sec: "${{ needs.frontend-build.outputs.duration_seconds }}",
              },
              {
                name: "Frontend Priority Lint",
                result: "${{ needs.frontend-priority-lint.result }}",
                sec: "${{ needs.frontend-priority-lint.outputs.duration_seconds }}",
              },
              {
                name: "Backend Smoke Tests",
                result: "${{ needs.backend-smoke-tests.result }}",
                sec: "${{ needs.backend-smoke-tests.outputs.duration_seconds }}",
              },
            ];
            const totalSec = rows.reduce((acc, r) => acc + Number(r.sec || 0), 0);
            const table = rows
              .map((r) => `| ${r.name} | ${r.result} | ${fmt(r.sec)} |`)
              .join("\n");
            const body = `${marker}
            ## CI Timing Report
            | Job | Result | Duration |
            |---|---|---|
            ${table}
            | Total | - | ${fmt(totalSec)} |`;

            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });
            const prev = comments.find((c) => c.body && c.body.includes(marker));
            if (prev) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: prev.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              });
            }
